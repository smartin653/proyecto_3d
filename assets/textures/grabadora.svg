<svg width="800" height="350" viewBox="0 0 800 350" xmlns="http://www.w3.org/2000/svg">

<style>
.reel-left{
    transform-origin:200px 120px;
    animation:spin 3s linear infinite;
}

.reel-right{
    transform-origin:600px 120px;
    animation:spinReverse 3s linear infinite;
}

.rec-dot{
    animation:blink 1s infinite;
}

.vu1{animation:vu1 .8s infinite alternate;}
.vu2{animation:vu2 .6s infinite alternate;}
.vu3{animation:vu3 .9s infinite alternate;}
.vu4{animation:vu4 .5s infinite alternate;}
.vu5{animation:vu5 .7s infinite alternate;}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@keyframes spinReverse{
    from{transform:rotate(360deg);}
    to{transform:rotate(0deg);}
}

@keyframes blink{
    0%,50%{opacity:1;}
    51%,100%{opacity:.2;}
}

@keyframes vu1{from{height:20px;}to{height:90px;}}
@keyframes vu2{from{height:40px;}to{height:110px;}}
@keyframes vu3{from{height:30px;}to{height:80px;}}
@keyframes vu4{from{height:50px;}to{height:120px;}}
@keyframes vu5{from{height:25px;}to{height:100px;}}
</style>

<!-- Cuerpo -->

<rect
    x="20"
    y="20"
    width="760"
    height="310"
    rx="20"
    fill="#5d675f"/>

<!-- Panel -->

<rect
    x="40"
    y="40"
    width="720"
    height="270"
    rx="10"
    fill="#707970"/>

<!-- Carrete izquierdo -->

<circle cx="200" cy="120" r="70" fill="#ddd"/>

<g class="reel-left">

    <circle cx="200" cy="120" r="65" fill="#e6e6e6"/>

    <rect x="192" y="55" width="16" height="35" fill="#666"/>
    <rect x="192" y="150" width="16" height="35" fill="#666"/>

    <rect x="135" y="112" width="35" height="16" fill="#666"/>
    <rect x="230" y="112" width="35" height="16" fill="#666"/>

</g>

<circle cx="200" cy="120" r="12" fill="#222"/>

<!-- Carrete derecho -->

<circle cx="600" cy="120" r="70" fill="#ddd"/>

<g class="reel-right">

    <circle cx="600" cy="120" r="65" fill="#e6e6e6"/>

    <rect x="592" y="55" width="16" height="35" fill="#666"/>
    <rect x="592" y="150" width="16" height="35" fill="#666"/>

    <rect x="535" y="112" width="35" height="16" fill="#666"/>
    <rect x="630" y="112" width="35" height="16" fill="#666"/>

</g>

<circle cx="600" cy="120" r="12" fill="#222"/>

<!-- Cinta -->

<path
    d="M260 120 C350 145 450 145 540 120"
    stroke="#2c1919"
    stroke-width="5"
    fill="none"/>

<!-- Display -->

<rect
    x="280"
    y="180"
    width="240"
    height="70"
    rx="8"
    fill="#0b0b0b"/>

<circle
    class="rec-dot"
    cx="315"
    cy="215"
    r="8"
    fill="#ff2a2a"/>

<text
    x="335"
    y="221"
    fill="#ff2a2a"
    font-family="monospace"
    font-size="22">
    REC
</text>

<text
    x="430"
    y="221"
    fill="#ffffff"
    font-family="monospace"
    font-size="22">
    00:48
</text>

<!-- VU METERS -->

<g transform="translate(120,280)">

    <rect class="vu1" x="0" width="18" y="-90" fill="#4cff4c"/>
    <rect class="vu2" x="28" width="18" y="-110" fill="#4cff4c"/>
    <rect class="vu3" x="56" width="18" y="-80" fill="#ffe14c"/>
    <rect class="vu4" x="84" width="18" y="-120" fill="#ff9c2b"/>
    <rect class="vu5" x="112" width="18" y="-100" fill="#ff4c4c"/>

</g>

<g transform="translate(550,280)">

    <rect class="vu5" x="0" width="18" y="-100" fill="#4cff4c"/>
    <rect class="vu4" x="28" width="18" y="-120" fill="#4cff4c"/>
    <rect class="vu3" x="56" width="18" y="-80" fill="#ffe14c"/>
    <rect class="vu2" x="84" width="18" y="-110" fill="#ff9c2b"/>
    <rect class="vu1" x="112" width="18" y="-90" fill="#ff4c4c"/>

</g>

</svg>